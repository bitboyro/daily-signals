name: Web verification
on:
  push:
  pull_request:
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned toolchain
        run: npm ci
      - name: Type-check and build listener
        run: npm run build
  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Listener unit and contract tests
        run: npm test
      - name: Upload web test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-junit-${{ github.run_attempt }}
          path: web/reports/web-unit.xml
          if-no-files-found: warn
  web-e2e:
    runs-on: ubuntu-latest
    needs: [web-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Java API
        run: mvn -B -ntp -DskipTests package
      - name: Listener journey against the running API
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run e2e
      - name: Upload web journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-junit-${{ github.run_attempt }}
          path: web/reports/web-e2e.xml
          if-no-files-found: warn
