name: daily-signals
services:
  kokoro:
    profiles: ["kokoro"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0@sha256:d32322c61254a871e0bc9c38d4e60cd18539cf9b1a2fc8f3ae04409061d0793b
    env_file: kokoro/runtime.env
    ports:
      - "127.0.0.1:8880:8880"
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: runtime.env
    ports:
      - "127.0.0.1:8151:8151"
  streamer:
    build:
      context: ..
      dockerfile: deploy/streamer.Dockerfile
    env_file: runtime.env
    ports:
      - "127.0.0.1:8152:8152"
    volumes:
      - ../contracts/publication-manifest-v2.json:/srv/published/manifest.json:ro
      - ../radio-api/src/main/resources/fixtures:/srv/published/fixtures:ro
