name: Java verification
on:
  push:
  pull_request:
jobs:
  java-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Changed test inventory
        run: python3 tools/list-changed-tests.py HEAD^ || true
      - name: Check module boundaries
        run: python3 tools/check-module-boundaries.py
      - name: Always run Java unit tests
        run: mvn -B -ntp verify
      - name: Check fixtures and example
        run: python3 tools/check-fixtures.py && python3 tools/check-source-example.py && python3 tools/check-docs.py
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: warn
      - name: Upload java-unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-jacoco-${{ github.run_attempt }}
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: warn
  annotation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The audit binds annotations to authored commits. GitHub's default PR
          # checkout is a synthetic merge commit, whose first-parent history is
          # not the branch history the annotations describe.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Feature annotation coverage and history
        run: python3 tools/check-annotations.py
  schedule-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cross-zone schedule tests
        run: mvn -B -ntp -pl radio-edition -am -Dtest=ScheduledEditionClockTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload schedule reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*ScheduledEditionClockTest.xml'
          if-no-files-found: warn
  edition-property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Edition ordering properties
        run: mvn -B -ntp -pl radio-editorial -am test -Dtest=CandidateOrderingPropertyTest -Dsurefire.failIfNoSpecifiedTests=false
  parser-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bounded source parser fuzz corpus
        run: mvn -B -ntp -pl radio-ingestion test -Dtest=SourceParserFuzzCorpusTest
  observability-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Structured API log contract
        run: mvn -B -ntp -pl radio-api -am test -Dtest=StructuredLogContractTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload schedule-test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-test-jacoco-${{ github.run_attempt }}
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: warn
  voice-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fixture voice contract
        run: mvn -B -ntp -pl radio-edition -am -Dtest=FixtureVoiceProviderTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload voice reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*FixtureVoiceProviderTest.xml'
          if-no-files-found: warn
      - name: Upload voice-contract coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-contract-jacoco-${{ github.run_attempt }}
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: warn
  object-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Local object protocol fixture
        run: mvn -B -ntp -pl radio-edition -am -Dtest=LocalS3ObjectAdapterTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload object reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*LocalS3ObjectAdapterTest.xml'
          if-no-files-found: warn
      - name: Upload object-integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-integration-jacoco-${{ github.run_attempt }}
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: warn
  publish-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish outbox integration
        run: mvn -B -ntp -pl radio-edition -am -Dtest='PublishOutboxTest,PublicationConsumerTest' -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*Publi*Test.xml'
          if-no-files-found: warn
      - name: Upload publish-integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-integration-jacoco-${{ github.run_attempt }}
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: warn
  audio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned synthetic audio
        run: python3 tools/check-audio-fixture.py
  postgres-reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daily_signals_test
          POSTGRES_USER: daily_signals
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_signals -d daily_signals_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAILY_SIGNALS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/daily_signals_test
      DAILY_SIGNALS_TEST_DATABASE_USER: daily_signals
      DAILY_SIGNALS_TEST_DATABASE_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: PostgreSQL reference integration
        run: mvn -B -ntp -pl radio-persistence -am verify
      - name: Upload PostgreSQL JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: warn
      - name: Upload postgres-reference coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-reference-jacoco-${{ github.run_attempt }}
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: warn
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Rust build and tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path streamer/Cargo.toml 2>&1 | tee rust-test.log
      - name: Rust line coverage
        run: cargo llvm-cov --manifest-path streamer/Cargo.toml --lcov --output-path rust.lcov
      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-${{ github.run_attempt }}
          path: |
            rust-test.log
            rust.lcov
          if-no-files-found: warn
  manifest-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Java publication manifest contract
        run: mvn -B -ntp -pl radio-api -am test -Dtest=PublicationManifestContractTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Rust publication manifest contract
        run: cargo test --manifest-path streamer/Cargo.toml manifest
  voice-playback-system:
    runs-on: ubuntu-latest
    needs: [java-unit, rust-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Java and Rust
        run: |
          mvn -B -ntp -DskipTests package
          cargo build --manifest-path streamer/Cargo.toml
      - name: Voice to playback system check
        run: python3 tools/voice-playback-smoke.py
  stream-integration:
    runs-on: ubuntu-latest
    needs: [java-unit, rust-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both services
        run: |
          mvn -B -ntp -DskipTests package
          cargo build --manifest-path streamer/Cargo.toml
      - name: Dual-process playback smoke
        run: python3 tools/dual-process-smoke.py
  performance-thresholds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Fixed stream request and byte profile
        run: cargo test --manifest-path streamer/Cargo.toml profiles_a_fixed_number_of_stream_routes
      - name: Fixed API request profile
        run: mvn -B -ntp -pl radio-api -am test -Dtest=DailySignalsTest#servesABoundedEditionCatalogLoadProfile -Dsurefire.failIfNoSpecifiedTests=false

