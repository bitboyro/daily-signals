name: Release qualification
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate:
        description: Release candidate profile
        required: true
        default: producer-listener
        type: choice
        options:
          - producer-listener
          - full-platform
  # Weekly full qualification of the default branch, Mondays 03:00 UTC.
  schedule:
    - cron: '0 3 * * 1'
jobs:
  release-qualification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daily_signals_test
          POSTGRES_USER: daily_signals
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_signals -d daily_signals_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAILY_SIGNALS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/daily_signals_test
      DAILY_SIGNALS_TEST_DATABASE_USER: daily_signals
      DAILY_SIGNALS_TEST_DATABASE_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Java and PostgreSQL qualification
        run: mvn -B -ntp verify
      - name: Rust qualification
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path streamer/Cargo.toml 2>&1 | tee rust-test.log
      - name: Fixture, contract and audio qualification
        run: |
          python3 tools/check-module-boundaries.py
          python3 tools/check-fixtures.py
          python3 tools/check-source-example.py
          python3 tools/check-audio-fixture.py
          python3 tools/check-docs.py
      - name: Web qualification
        working-directory: web
        run: |
          npm ci
          npm run release:package
          npm test
          npm run e2e
      - name: Retain listener release candidate
        uses: actions/upload-artifact@v4
        with:
          name: listener-release-candidate-${{ github.run_attempt }}
          path: web/artifacts/daily-signals-listener-*.zip
          retention-days: 30
          if-no-files-found: error
      - name: Cross-process and container qualification
        run: |
          cargo build --manifest-path streamer/Cargo.toml
          python3 tools/dual-process-smoke.py
          python3 tools/voice-playback-smoke.py
          python3 tools/container-smoke.py
      - name: Start E6 deployment candidate
        run: docker compose -f deploy/compose.yaml up -d --build
      - name: Qualify E6 cross-stack deployment
        run: python3 tools/post-deploy-health.py --report e6-cross-stack.json
      - name: Capture E6 deployment diagnostics
        if: always()
        run: docker compose -f deploy/compose.yaml logs > e6-compose.log && docker compose -f deploy/compose.yaml down
      - name: Retain E6 cross-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6-cross-stack-${{ github.run_attempt }}
          path: |
            e6-cross-stack.json
            e6-compose.log
          retention-days: 30
          if-no-files-found: warn
      - name: Record tag-bound release manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/create-release-manifest.py --tag "$RELEASE_TAG"
      - name: Retain release manifest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.run_attempt }}
          path: release-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Retain Java reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-java-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*.xml'
          retention-days: 30
          if-no-files-found: warn
      - name: Retain web reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-web-junit-${{ github.run_attempt }}
          path: web/reports/*.xml
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Rust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-rust-log-${{ github.run_attempt }}
          path: rust-test.log
          retention-days: 30
          if-no-files-found: warn
