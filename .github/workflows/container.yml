name: Container verification
on:
  push:
  pull_request:
jobs:
  install-smoke-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Portable install contract (${{ matrix.os }})
        run: python3 tools/install-smoke.py
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable installation contract
        run: python3 tools/install-smoke.py
      - name: Validate Compose model
        run: docker compose -f deploy/compose.yaml config --quiet
  upgrade-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daily_signals_test
          POSTGRES_USER: daily_signals
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_signals -d daily_signals_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAILY_SIGNALS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/daily_signals_test
      DAILY_SIGNALS_TEST_DATABASE_USER: daily_signals
      DAILY_SIGNALS_TEST_DATABASE_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prior release configuration contract
        run: python3 tools/upgrade-smoke.py
      - name: Prior database migration contract
        run: mvn -B -ntp -pl radio-persistence -am test -Dtest='PopulatedMigrationPostgresTest,LegacyMigrationPostgresTest' -Dsurefire.failIfNoSpecifiedTests=false
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build services for host-run descriptor check
        run: |
          mvn -B -ntp -DskipTests package
          cargo build --manifest-path streamer/Cargo.toml
          npm --prefix web ci
          npm --prefix web run build
      - name: Descriptor and host-run startup check
        run: python3 tools/container-smoke.py
  post-deploy-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start deployment candidate
        run: docker compose -f deploy/compose.yaml up -d --build
      - name: Probe deployed listener and playback
        run: python3 tools/post-deploy-health.py --revision "${{ github.sha }}" --report post-deploy-health.json
      - name: Validate deployment evidence
        run: python3 -c 'import json; r=json.load(open("post-deploy-health.json")); assert r["schemaVersion"] == 2 and r["revision"] == "${{ github.sha }}" and r["result"] == "PASS"'
      - name: Capture deployment diagnostics
        if: always()
        run: docker compose -f deploy/compose.yaml logs > compose.log && docker compose -f deploy/compose.yaml down
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-health-${{ github.run_attempt }}
          path: |
            post-deploy-health.json
            compose.log
          if-no-files-found: warn
