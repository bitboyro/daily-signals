name: daily-signals
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: daily_signals
      POSTGRES_USER: daily_signals
      POSTGRES_PASSWORD: ${DAILY_SIGNALS_DATABASE_PASSWORD:-daily-signals-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_signals -d daily_signals"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - daily-signals-postgres:/var/lib/postgresql/data
  kokoro:
    profiles: ["kokoro"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0@sha256:d32322c61254a871e0bc9c38d4e60cd18539cf9b1a2fc8f3ae04409061d0793b
    env_file: kokoro/runtime.env
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ${KOKORO_MODEL_DIR:-./kokoro/models}:/models:ro
      - ${KOKORO_VOICES_DIR:-./kokoro/voices}:/voices:ro
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: runtime.env
    environment:
      DAILY_SIGNALS_DATABASE_URL: jdbc:postgresql://postgres:5432/daily_signals
      DAILY_SIGNALS_DATABASE_USER: daily_signals
      DAILY_SIGNALS_DATABASE_PASSWORD: ${DAILY_SIGNALS_DATABASE_PASSWORD:-daily-signals-local}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8151:8151"
  object-store:
    image: python:3.14.0-slim-bookworm
    command: ["python3", "-m", "http.server", "9000", "--directory", "/srv/objects"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/daily-signals/editions/demo.json')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ../contracts/publication-manifest-v2.json:/srv/objects/daily-signals/editions/demo.json:ro
      - ../radio-api/src/main/resources/fixtures:/srv/objects/daily-signals/fixtures:ro
  streamer:
    build:
      context: ..
      dockerfile: deploy/streamer.Dockerfile
    env_file: runtime.env
    depends_on:
      object-store:
        condition: service_healthy
    ports:
      - "127.0.0.1:8152:8152"

volumes:
  daily-signals-postgres:
