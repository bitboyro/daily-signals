name: Java verification
on:
  push:
  pull_request:
jobs:
  java-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Changed test inventory
        run: python3 tools/list-changed-tests.py HEAD^ || true
      - name: Check module boundaries
        run: python3 tools/check-module-boundaries.py
      - name: Always run Java unit tests
        run: mvn -B -ntp verify
      - name: Check fixtures and example
        run: python3 tools/check-fixtures.py && python3 tools/check-source-example.py
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: warn
  schedule-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cross-zone schedule tests
        run: mvn -B -ntp -pl radio-edition -am -Dtest=ScheduledEditionClockTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload schedule reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*ScheduledEditionClockTest.xml'
          if-no-files-found: warn
  postgres-reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daily_signals_test
          POSTGRES_USER: daily_signals
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_signals -d daily_signals_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAILY_SIGNALS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/daily_signals_test
      DAILY_SIGNALS_TEST_DATABASE_USER: daily_signals
      DAILY_SIGNALS_TEST_DATABASE_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: PostgreSQL reference integration
        run: mvn -B -ntp -pl radio-persistence -am verify
      - name: Upload PostgreSQL JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit-${{ github.run_attempt }}
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: warn
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust build and tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path streamer/Cargo.toml 2>&1 | tee rust-test.log
      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-${{ github.run_attempt }}
          path: rust-test.log
          if-no-files-found: warn
  stream-integration:
    runs-on: ubuntu-latest
    needs: [java-unit, rust-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both services
        run: |
          mvn -B -ntp -DskipTests package
          cargo build --manifest-path streamer/Cargo.toml
      - name: Dual-process playback smoke
        run: python3 tools/dual-process-smoke.py

