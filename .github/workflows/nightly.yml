name: Nightly qualification
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: nightly-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nightly-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Run bounded nightly soak
        run: python3 tools/nightly-soak.py --iterations ${{ github.event_name == 'pull_request' && 2 || 5 }}
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-soak-${{ github.run_attempt }}
          path: nightly-soak-report.json
          if-no-files-found: warn
  editorial-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build editorial dependencies
        run: mvn -B -ntp -pl radio-editorial -am install -DskipTests
      - name: Run editorial mutation qualification
        run: mvn -B -ntp -f radio-editorial/pom.xml -Pmutation org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-mutation-${{ github.run_attempt }}
          path: radio-editorial/target/pit-reports/**
          if-no-files-found: warn
